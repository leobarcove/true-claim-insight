name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Two jobs, deliberately separated:
#   typecheck  — does it still compile?
#   compliance — do the controls the platform claims still hold?
#
# The compliance job is not "just tests". docs/MASTER_PLAN.md §3.5 makes this
# suite the evidencing mechanism for the controls asserted to BNM (FSA s.146
# allows examination without notice), so a red compliance job means a
# compliance regression, not merely a broken build. Do not skip or soft-fail it.
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. package.json's "packageManager":
      # "pnpm@9.15.0" is the single source of truth, and action-setup@v4
      # ERRORS OUT when both are given — which it had been doing on every run
      # since the workflow was written, so no job ever reached a test.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @tci/prisma-client exec prisma generate

      # ALL four workspace packages, not just shared-types. The apps import
      # @tci/crypto and @tci/prisma-client as compiled output (AuditWriter,
      # SENSITIVE_FIELD_OMIT, TransferRegister, EncryptionService), and a
      # developer machine always has their dist/ lying around from an earlier
      # build — so this gap was invisible locally and fatal on a fresh
      # checkout. Prisma generate runs first: prisma-client's own tsc needs
      # the generated types.
      - name: Build workspace packages
        run: pnpm --filter "./packages/*" build

      - name: Typecheck all apps
        run: |
          failed=0
          for app in api-gateway case-service video-service risk-engine adjuster-portal claimant-web; do
            echo "::group::typecheck $app"
            if ! (cd "apps/$app" && npx tsc --noEmit); then
              echo "::error title=Typecheck failed::$app"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed

      - name: Lint TypeScript workspaces
        run: pnpm lint

  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. package.json's "packageManager":
      # "pnpm@9.15.0" is the single source of truth, and action-setup@v4
      # ERRORS OUT when both are given — which it had been doing on every run
      # since the workflow was written, so no job ever reached a test.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build shared packages
        run: pnpm --filter @tci/shared-types build

      - name: Generate Prisma client
        run: pnpm --filter @tci/prisma-client exec prisma generate

      # Every package, not just case-service. A compliance matrix row may only
      # reach PASS with a test asserting the control (§3.5), so a suite CI does
      # not run cannot support a verdict — the audit-scope and encryption suites
      # were passing locally and never executing here.
      #
      # Suites, and the controls they hold:
      #   tenant.service          PII redaction, NRIC masking fail-closed
      #   case-flows              CSP flags advisory, evidence completeness
      #   sensitive-fields        no encrypted column reaches a response body
      #   data-ownership          no undeclared cross-context writes
      #   working-days / sla.*    CSP working-day arithmetic, clock lifecycle
      #   report-templates        PD 12.6 disclosures mandatory
      #   report-authority        PD 12.7 authorship, sign-off, licence flip
      #   claim-authority         A3 segregation of duties, approval ceilings
      #   audit-scope (gateway)   what becomes evidence; no body, no identifiers
      #   encryption (crypto)     envelope encryption, KMS custody migration
      - name: Compliance tests
        run: pnpm test
