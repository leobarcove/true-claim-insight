# True Claim Insight — staging stack (AWS EC2, ap-southeast-5).
#
# Run from this directory, always with the env file so interpolation works:
#   docker compose --env-file .env.staging -f docker-compose.staging.yml up -d
#
# Only the Caddy edge publishes ports. Postgres and Redis are reachable solely
# on the compose network. Derived values (DATABASE_URL, public file URLs) are
# composed HERE from .env.staging scalars — the env file stays a list of plain
# secrets and hostnames.
#
# STAGING HOLDS SYNTHETIC DATA ONLY. Seeded demo identities, never a real
# NRIC, recording or bank account (docs/MASTER_PLAN.md §8, 31 July 2026).

name: tci-staging

x-node-env: &node-env
  NODE_ENV: production
  DATABASE_URL: postgresql://tci:${POSTGRES_PASSWORD:?set in .env.staging}@postgres:5432/true_claim_insight
  REDIS_URL: redis://redis:6379
  CASE_SERVICE_URL: http://case-service:3001
  VIDEO_SERVICE_URL: http://video-service:3002
  RISK_ENGINE_URL: http://risk-engine:3004
  RISK_ANALYZER_URL: http://risk-analyzer:3005

services:
  postgres:
    image: postgres:16.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: tci
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.staging}
      POSTGRES_DB: true_claim_insight
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tci']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies committed Prisma migrations, then exits. Seeding is a
  # deliberate manual step (see README) — never automatic.
  migrate:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
      target: migrate
    env_file: .env.staging
    environment: *node-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: 'no'

  api-gateway:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
      target: api-gateway
    restart: unless-stopped
    env_file: .env.staging
    environment:
      <<: *node-env
      CORS_ORIGINS: ${ADJUSTER_ORIGIN:?}, ${CLAIMANT_ORIGIN:?}, ${AGENT_ORIGIN:?}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3000/api/v1/health/liveness']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  case-service:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
      target: case-service
    restart: unless-stopped
    env_file: .env.staging
    environment:
      <<: *node-env
      CASE_SERVICE_PUBLIC_URL: ${ADJUSTER_ORIGIN:?}/case-files
    volumes:
      - case_storage:/app/apps/case-service/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3001/api/v1/health/liveness']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  video-service:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
      target: video-service
    restart: unless-stopped
    env_file: .env.staging
    environment: *node-env
    volumes:
      - video_uploads:/app/apps/video-service/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '-sf', 'http://localhost:3002/api/v1/health/liveness']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  risk-engine:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
      target: risk-engine
    restart: unless-stopped
    env_file: .env.staging
    environment:
      <<: *node-env
      RISK_ENGINE_PUBLIC_URL: ${ADJUSTER_ORIGIN:?}/risk-files
    volumes:
      - risk_storage:/app/apps/risk-engine/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  risk-analyzer:
    build:
      context: ../..
      dockerfile: deploy/staging/risk-analyzer.Dockerfile
    restart: unless-stopped
    env_file: .env.staging
    volumes:
      - analyzer_storage:/srv/risk-analyzer/storage

  edge:
    build:
      context: ../..
      dockerfile: deploy/staging/Dockerfile
      target: edge
    restart: unless-stopped
    ports:
      - '${CADDY_HTTP_PORT:-80}:80'
      - '${CADDY_HTTPS_PORT:-443}:443'
    environment:
      ADJUSTER_HOST: ${ADJUSTER_HOST:?}
      CLAIMANT_HOST: ${CLAIMANT_HOST:?}
      # Same build as CLAIMANT_HOST, different name — the name is what selects
      # the agent-assisted surface. See deploy/staging/Caddyfile.
      AGENT_HOST: ${AGENT_HOST:?}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api-gateway

volumes:
  postgres_data:
  redis_data:
  case_storage:
  risk_storage:
  video_uploads:
  analyzer_storage:
  caddy_data:
  caddy_config:
